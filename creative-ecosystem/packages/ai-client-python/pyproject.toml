[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icc-ai-client"
version = "0.1.0"
description = "Shared AI client for ICC - Gemini, Claude, OpenAI, Grok"
requires-python = ">=3.11"
dependencies = [
    "google-generativeai>=0.8.0",
    "openai>=1.0.0",
    "anthropic>=0.36.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
